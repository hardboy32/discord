server:
  address: 127.0.0.1
  port: 2333

lavalink:
  server:
    password: "${LAVALINK_PASSWORD:local-only-password-not-for-public-use}"
    sources:
      youtube: false
      soundcloud: true
      local: true
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
  pluginsDir: "/app/data/lavalink-plugins"
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    remoteCipher:
      url: "http://127.0.0.1:8001"
      password: "${YT_CIPHER_PASSWORD}"
      userAgent: "hardboy-discord-lavalink"
    clients:
      - WEBEMBEDDED
      - TVHTML5_SIMPLY
      - WEB
      - MWEB
      - MUSIC
      - ANDROID_VR

logging:
  level:
    root: WARN
